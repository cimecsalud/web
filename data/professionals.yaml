  scientific_experience:
  - Autor de numerosos artículos en revistas nacionales e internacionales, así como de varios capítulos de libros relacionados
    con la patología de la rodilla.
  - 'Miembro de varias sociedades científicas: Sociedad Española de Cirugía Ortopédica y Traumatología, (SECOT), Sociedad
