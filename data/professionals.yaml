- name: Carlos Alberto Encinas Ullan
  college_number: '282861304'
  position: Traumatólogo
  image: /images/profesionales/carlos-alberto-encinas.png
  education:
  - Licenciado en Medicina por la Universidad de Salamanca.
  - Especialidad de Cirugía Ortopédica y Traumatología en el Hospital Universitario La Paz.
  - Especialidad en cirugía de rodilla.
  - Certificado de capacitación para realizar cirugía de prótesis de rodilla robotizada, tanto con Robot Mako (Stryker) como
    con Robot Rosa (Zimmer-Biomet).
