{{ define "main" }}
<section class="error-page">
    <div class="container">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p>Lo sentimos, la página que buscas no existe o ha sido movida.</p>
        <div class="error-page-actions">
            <a href="/" class="btn">Volver al Inicio</a>
            <a href="https://citaonline.portalns.es/cimec" target="_blank" rel="noopener" class="btn btn-secondary">Pedir Cita</a>
        </div>
        <div class="error-page-help">
            <h3>¿Necesitas ayuda?</h3>
            <p>
                Llámanos al <strong>{{ .Site.Params.phone }}</strong><br>
                Escríbenos a <strong>{{ .Site.Params.email }}</strong>
            </p>
        </div>
    </div>
</section>
{{ end }}
