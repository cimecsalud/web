{{ $videoPath := .Get "src" }}
{{ $fullPath := printf "static%s" $videoPath }}
{{ if fileExists $fullPath }}
{{ $videoBase := strings.TrimSuffix ".mp4" $videoPath }}
{{ $videoName := path.Base $videoBase }}
<video class="video-autoplay" width="100%" autoplay muted loop playsinline poster="/videos/posters/{{ $videoName }}.jpg">
    <source src="{{ $videoBase }}.webm" type="video/webm">
    <source src="{{ $videoPath }}" type="video/mp4">
</video>
{{ end }}
